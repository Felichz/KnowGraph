services:
  - type: web
    name: learning-workspace-gateway
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/ai/status
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GATEWAY_HOST
        value: 0.0.0.0
      - key: ALLOW_PRIVATE_PROVIDER_URLS
        value: "false"
      # Set this after Vercel gives you the production URL. Do not use '*'.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
